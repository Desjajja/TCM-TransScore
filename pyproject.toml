[project]
name = "tcm-translation-eval"
version = "0.1.0"
description = "中医文献翻译质量评估：本地NLI与OpenAI格式API语言模型，含术语、语法、结构等维度评分"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy>=1.24.0",
    "spacy>=3.5.0",
    "torch>=2.0.0",
    "transformers>=4.44.0",
    "openai>=1.12.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
grammar = ["language-tool-python>=2.7.0"]
yaml = ["pyyaml>=6.0"]
