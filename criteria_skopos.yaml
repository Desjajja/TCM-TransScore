# 翻译理论评分准则配置文件 (YAML格式)
# 本文件定义了基于Skopos理论（目的论）的翻译质量评估标准

name: "Skopos理论评分"

criteria: |
  ## 评分准则：Skopos理论（目的论）

  根据德国功能主义翻译理论创始人Hans J. Vermeer提出的Skopos理论，翻译活动应以翻译目的为导向。
  优秀的翻译应满足特定交际目的，并在目标文化语境中发挥预期功能。

  ### 1. 目的性原则（Skopos Rule）- 40%
  
  **评估要点**：
  - 译文是否实现了预期的交际目的
  - 对于中医学术文献，是否有效传递专业知识给目标读者（英语国家的医疗专业人士、研究者）
  - 译文是否适合其预期用途（学术交流、临床参考、教学使用等）
  - 专业信息传递的准确性和有效性
  
  **评分标准**：
  - 9-10分：完全达成交际目的，信息传递精准高效
  - 7-8分：基本达成目的，有小瑕疵但不影响理解
  - 5-6分：部分达成目的，影响部分信息传递
  - 3-4分：目的达成度低，交际效果不佳
  - 0-2分：未能达成预期目的

  ### 2. 连贯性原则（Coherence Rule）- 30%
  
  **评估要点**：
  - 译文内部逻辑是否连贯一致
  - 目标读者（英语使用者）能否顺畅理解译文
  - 专业性与可读性的平衡
  - 句间衔接和段落结构的合理性
  - 术语使用的一致性
  
  **评分标准**：
  - 9-10分：逻辑连贯，易于理解，阅读流畅
  - 7-8分：基本连贯，偶有不够顺畅之处
  - 5-6分：连贯性一般，部分内容理解困难
  - 3-4分：逻辑混乱，难以理解
  - 0-2分：严重不连贯，无法理解

  ### 3. 忠实性原则（Fidelity Rule）- 30%
  
  **评估要点**：
  - 在满足翻译目的的前提下，对源文本的忠实程度
  - 专业内容（证型、病机、治则等）是否准确传达
  - 关键信息是否完整保留
  - 是否有不必要的增删或曲解
  
  **注意**：忠实性原则从属于目的性原则。如果为实现翻译目的需要适当调整，应以目的为优先。
  
  **评分标准**：
  - 9-10分：高度忠实，准确传达源文信息
  - 7-8分：基本忠实，有小偏差但可接受
  - 5-6分：忠实度一般，有明显信息损失或偏差
  - 3-4分：忠实度低，较多曲解或遗漏
  - 0-2分：严重偏离源文

  ---

  ## 综合评分范围：0-10分

  **评分说明**：
  - **9-10分**：优秀。三项原则均得到良好体现，译文完全达成预期目的，且保持高度连贯和忠实
  - **7-8分**：良好。主要原则体现较好，有小瑕疵但不影响整体质量
  - **5-6分**：及格。基本满足要求，但存在明显不足，需要改进
  - **3-4分**：较差。多项原则体现不足，翻译质量问题明显
  - **0-2分**：很差。严重偏离理论原则，翻译质量极差

  ---

  ## 评价要求

  1. **按照上述三项原则**（目的性、连贯性、忠实性）分别进行分析
  2. **结合中医专业领域特点**进行评估
  3. **给出具体例子**说明译文的优点和不足
  4. **提供改进建议**（如有必要）
  5. **最后给出总分**，用 \boxed{分数} 格式包裹，例如：\boxed{8.5}
